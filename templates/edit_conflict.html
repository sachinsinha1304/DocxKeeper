<!DOCTYPE html>
<html><head><title>Conflict</title></head>
<body style="font-family:sans-serif; text-align:center; margin-top:80px;">
    <h2>⚠️ Someone else saved changes while you were editing</h2>
    <p>Your changes were <strong>not saved</strong> to avoid overwriting theirs.</p>
    <p>Reload the document to see the latest version, then reapply your edits.</p>
    <a href="/edit-docx?parent={{ parent }}&name={{ filename }}">Reload Latest Version</a>
</body></html>
