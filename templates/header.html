<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Documents</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3 mb-4 shadow-sm">
    <div class="container-fluid">
        
        <!-- Left: Logo / Brand -->
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
            <svg height="24" aria-hidden="true" viewBox="0 0 16 16" version="1.1" width="24" class="text-light fill-current">
                <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
            </svg>
            <span class="fw-semibold">Documents</span>
        </a>

        <!-- Center: Search Form & Filter Bar -->
        <div class="mx-auto col-12 col-md-6 col-lg-5 my-2 my-lg-0">
            <!-- Form wrapping the input so pressing Enter or clicking submit works -->
            <form action="{{ url_for('search_bp.search') }}" method="GET" class="d-flex">
                <div class="input-group input-group-sm bg-secondary bg-opacity-25 border border-secondary rounded overflow-hidden w-100">
                    <span class="input-group-text bg-transparent border-0 text-muted ps-2">🔍</span>
                    <input type="text" 
                           class="form-control bg-transparent border-0 text-light shadow-none" 
                           placeholder="Type to filter repositories..." 
                           name="filter_text"
                           id="repoFilterInput"
                           aria-label="Filter repositories">
                    <!-- Submit button styled nicely inside the input group -->
                    <button type="submit" class="btn btn-sm btn-outline-secondary border-0 text-muted px-2" title="Search">
                        ↵
                    </button>
                </div>
            </form>
        </div>

        <!-- Empty spacer to balance layout on large screens -->
        <div class="d-none d-lg-block" style="width: 120px;"></div>

    </div>
</nav>

</body>
