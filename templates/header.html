<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons for modern UI -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Documents</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #31103f 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #f8fafc;
            overflow-x: hidden;
            margin: 0;
        }

        /* Background ambient glowing spheres */
        .ambient-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -100px;
            z-index: 0;
            filter: blur(40px);
            pointer-events: none;
        }

        .ambient-glow-2 {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, rgba(0,0,0,0) 70%);
            bottom: -100px;
            right: -100px;
            z-index: 0;
            filter: blur(40px);
            pointer-events: none;
        }

        /* Navbar Glassmorphism Styling */
        .navbar-custom {
            position: relative;
            z-index: 10;
            background: rgba(30, 41, 59, 0.7) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.025em;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Search Input Group Custom Glass Styling */
        .search-group {
            background-color: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 12px !important;
            transition: all 0.2s ease-in-out;
        }

        .search-group:focus-within {
            background-color: rgba(15, 23, 42, 0.8) !important;
            border-color: #818cf8 !important;
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.15) !important;
        }

        .search-input {
            background: transparent !important;
            color: #fff !important;
        }

        .search-input::placeholder {
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom px-3 py-3 mb-4">
        <div class="container-fluid">
            
            <!-- Left: Logo / Brand -->
            <a class="navbar-brand d-flex align-items-center gap-2 text-decoration-none" href="/">
                <div class="p-2 rounded-3 text-white d-flex align-items-center justify-content-center shadow-sm" style="background: var(--primary-gradient);">
                    <i class="bi bi-journal-richtext fs-5"></i>
                </div>
                <span class="fs-5 fw-bold text-white">Documents</span>
            </a>

            <!-- Center: Search Form & Filter Bar -->
            <div class="mx-auto col-12 col-md-6 col-lg-5 my-2 my-lg-0">
                <form action="{{ url_for('search_bp.search') }}" method="GET" class="d-flex">
                    <div class="input-group input-group-sm search-group overflow-hidden w-100 px-2 py-1">
                        <span class="input-group-text bg-transparent border-0 text-muted ps-1"><i class="bi bi-search"></i></span>
                        <input type="text" 
                               class="form-control search-input border-0 shadow-none ps-2" 
                               placeholder="Type to filter repositories..." 
                               name="filter_text"
                               id="repoFilterInput"
                               aria-label="Filter repositories">
                        <button type="submit" class="btn btn-sm btn-link text-muted text-decoration-none px-2 border-0 shadow-none" title="Search">
                            <i class="bi bi-return-left text-indigo"></i>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Right: Logout Action -->
            <div class="d-flex align-items-center justify-content-end" style="min-width: 120px;">
                <a href="{{ url_for('auth.logout') }}" class="btn btn-sm btn-outline-danger px-3 py-2 rounded-pill shadow-sm d-flex align-items-center">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </a>
            </div>

        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
