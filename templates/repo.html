<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Docx Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h2>Document Explorer</h2>
    
    {% if current_path %}
        <a href="javascript:history.back()" class="btn btn-secondary mb-3">⬅ Back</a>
    {% endif %}

    <hr>

    {% if isEmpty %}
        <p class="text-muted">This folder is empty.</p>
    {% else %}
        <div class="list-group">
            {% for item in folder_list %}
                {% if item.is_file %}
                    <!-- File item: links to download/view the file -->
                    <a href="/all-docx/{{ item.route_path }}" class="list-group-item list-group-item-action">
                        📄 <strong>{{ item.name }}</strong> <span class="text-muted float-end">File</span>
                    </a>
                {% else %}
                    <!-- Folder item: links deeper into the directory tree -->
                    <a href="/all-docx/{{ item.route_path }}" class="list-group-item list-group-item-action list-group-item-primary">
                        📁 <strong>{{ item.name }}</strong> <span class="float-end">Folder ➡</span>
                    </a>
                {% endif %}
            {% endfor %}
        </div>
    {% endif %}

</body>
</html>
